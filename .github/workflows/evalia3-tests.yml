
name: Evalia 3.0 y 3.2 - comprobaciones tecnicas

on:
  push:
    branches:
      - feature/evalia-3-rubrica-universal
      - feature/evalia-3-1-ajustes-semanticos
      - feature/evalia-3-2-evidencia-conceptual
    paths:
      - "feature/core/**"
      - "rubrica_evalia_3_2_evidencias.json"
      - ".github/workflows/evalia3-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Importacion, rubricas y rutas seguras
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar sintaxis del nucleo
        run: python -m compileall -q feature/core

      - name: Probar integracion sin OCR ni APIs
        shell: bash
        run: |
          python - <<'PY'
          from unittest.mock import patch

          from feature.core.rubric_v3 import (
              compile_question,
              RubricValidationError,
          )
          from feature.core.models import (
              EvaluationInput,
              ResponseInput,
          )
          from feature.core.engine import evaluate


          def task(tipo, maximo=1, criterios=None, **extras):
              return compile_question({
                  "id": "P1",
                  "enunciado": "Pregunta de prueba",
                  "tipo": tipo,
                  "maximo": maximo,
                  "aprobada": True,
                  "criterios": criterios or [],
                  **extras,
              }, assessment_id="CI-3", domain="general")


          def run(t, texto):
              return evaluate(EvaluationInput(
                  assessment_id="CI-3",
                  task=t,
                  response=ResponseInput(text=texto),
                  language="es",
              ))


          def check(test, message):
              if not test:
                  raise AssertionError(message)
              print("OK:", message)


          # 1. Respetar los puntos del profesor.
          t = task("abierta", maximo=3, criterios=[
              {
                  "id": "C1",
                  "descripcion": "Primera idea",
                  "puntos": 2,
              },
              {
                  "id": "C2",
                  "descripcion": "Segunda idea",
                  "puntos": 1,
              },
          ])
          check(
              [c.weight for c in t.assessment_spec.criteria]
              == [2, 1],
              "La rubrica conserva 2+1 puntos",
          )

          # 2. Rechazar rubricas inconsistentes.
          try:
              task("abierta", maximo=4, criterios=[
                  {
                      "id": "C1",
                      "descripcion": "Idea",
                      "puntos": 2,
                  },
              ])
          except RubricValidationError:
              print("OK: Pauta incompatible rechazada")
          else:
              raise AssertionError(
                  "Se acepto una pauta incorrecta"
              )

          # 3. V/F debe corregirse por clave exacta.
          with patch(
              "feature.core.engine.represent",
              side_effect=AssertionError(
                  "No se debe usar el motor semantico"
              ),
          ):
              correct = run(
                  task("verdadero_falso", clave="V"), "V"
              )
              incorrect = run(
                  task("verdadero_falso", clave="V"), "F"
              )

          check(
              correct.judgment.score == 1
              and incorrect.judgment.score == 0,
              "V/F utiliza la clave exacta",
          )

          # 4. Las notas no son definitivas.
          check(
              correct.traceability[
                  "final_grade_authorized"
              ] is False
              and correct.delegation.decision
              not in {"AUTO_ACCEPT", "ACCEPT_WITH_CAUTION"},
              "La nota v3 sigue siendo provisional",
          )

          # 5. Completar: respuesta aprobada.
          completion = run(
              task(
                  "completar",
                  respuesta_esperada="fonema",
              ),
              "fonema",
          )
          check(
              completion.judgment.score == 1,
              "Completar utiliza respuesta aprobada",
          )

          # 6. Matematicas requieren validador.
          numeric = run(
              task("numerica", criterios=[
                  {
                      "id": "C1",
                      "descripcion": "Resultado correcto",
                      "puntos": 1,
                  },
              ]),
              "5",
          )
          check(
              numeric.judgment.score == 0
              and numeric.judgment.metadata[
                  "unscored_criteria"
              ] == ["C1"]
              and numeric.traceability[
                  "final_grade_authorized"
              ] is False,
              "Matematicas queda pendiente de validar",
          )

          # 7. Fallo semantico: revision humana.
          with patch(
              "feature.core.engine.represent",
              side_effect=RuntimeError("Modelo ausente"),
          ):
              pending = run(
                  task("abierta", criterios=[
                      {
                          "id": "C1",
                          "descripcion": "Explicacion causal",
                          "puntos": 1,
                      },
                  ]),
                  "Respuesta potencialmente correcta",
              )

          check(
              pending.judgment.metadata[
                  "unscored_criteria"
              ] == ["C1"]
              and pending.delegation.decision
              == "HUMAN_REVIEW",
              "Modelo ausente exige revision humana",
          )

          print(
              "Pruebas tecnicas Evalia 3.0 completadas."
          )
          PY

      - name: Probar rubrica y evidencias de Evalia 3.2 sin modelo externo
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from unittest.mock import patch

          from feature.core.adjudication import AdjudicationResult
          from feature.core.engine import evaluate, _criterion_adjudications
          from feature.core.models import (
              EvaluationInput, ResponseInput, RepresentationResult
          )
          from feature.core.rubric_v3 import (
              compile_assessment, compile_question, RubricValidationError
          )
          from feature.core.rubric_scoring_v3 import assess_v3

          path = Path('rubrica_evalia_3_2_evidencias.json')
          rubric = json.loads(path.read_text(encoding='utf-8'))
          tasks = {t.id: t for t in compile_assessment(rubric)}

          assert len(tasks) == 34, 'Deben existir 34 preguntas'
          assert abs(
              sum(t.max_score for t in tasks.values()) - 70.0
          ) < 1e-6
          assert sum(
              len(q['criterios']) for q in rubric['preguntas']
          ) == 60
          assert sum(
              len(t.assessment_spec.criteria)
              for t in tasks.values()
          ) == 62
          assert all(
              t.assessment_spec.scoring_policy['teacher_approved']
              for t in tasks.values()
          )
          print(
              'OK: 34 preguntas, 60 criterios y 70 puntos, '
              'aprobaciones preservadas'
          )

          # P2: equivalencia expresamente autorizada.
          p2 = tasks['P2']
          assert 'procesamiento' in (
              p2.assessment_spec.criteria[0].accepted_values
          )

          r2 = evaluate(EvaluationInput(
              assessment_id=rubric['id'],
              task=p2,
              response=ResponseInput(text='Procesamiento'),
              language='es'
          ))
          assert r2.judgment.score == 1.0
          assert r2.traceability[
              'final_grade_authorized'
          ] is False
          print(
              'OK: P2 acepta variante autorizada '
              'sin embeddings; nota provisional'
          )

          # P30: tres observables independientes.
          p30 = tasks['P30']
          criterion = p30.assessment_spec.criteria[0]
          units = criterion.metadata['observables']
          ids = [u['id'] for u in units]

          assert criterion.metadata[
              'observables_aprobados'
          ] is True
          assert criterion.metadata[
              'credito_por_unidad'
          ] is True

          assert len(ids) == 3
          assert len(set(ids)) == 3
          assert set(ids) == {
              'P30_velocidad',
              'P30_precision',
              'P30_prosodia'
          }
          assert all(u['weight'] > 0 for u in units)
          print(
              'OK: P30 contiene tres observables '
              'aprobados e independientes'
          )

          # El motor debe transmitir los observables completos.
          captured = []

          def fake_adjudicate(**kw):
              captured.extend(
                  kw['context']['conceptual_units']
              )
              return AdjudicationResult(
                  relation='undetermined',
                  score=0.0,
                  confidence=0.0,
                  rationale='Simulacion de CI'
              )

          data = EvaluationInput(
              assessment_id=rubric['id'],
              task=p30,
              response=ResponseInput(
                  text='velocidad precision prosodia'
              ),
              language='es'
          )

          with patch(
              'feature.core.engine.adjudicate',
              side_effect=fake_adjudicate
          ):
              _criterion_adjudications(
                  data,
                  RepresentationResult(language='es')
              )

          assert [u['id'] for u in captured] == ids
          print(
              'OK: engine transmite los tres '
              'observables sin duplicacion'
          )

          # Comprobar puntuacion con dictamen simulado.
          # No representa precision semantica del modelo real.
          def synthetic(relation, included, valid=True):
              reported = [
                  {
                      'id': uid,
                      'required': True,
                      'matched': uid in included
                  }
                  for uid in ids
              ] if valid else []

              return AdjudicationResult(
                  relation=relation,
                  score=0.0,
                  confidence=0.7,
                  rationale='Prueba sintetica de interfaz',
                  evidence='respuesta de prueba',
                  metadata={
                      'semantic_similarity': 0.8,
                      'required_conceptual_coverage':
                          len(included) / 3,
                      'conceptual_unit_results': reported
                  }
              )

          def score(adjudication):
              result, _ = assess_v3(
                  data,
                  RepresentationResult(language='es'),
                  {criterion.id: adjudication}
              )
              return result

          all_ids = set(ids)
          full = score(
              synthetic('correct', all_ids)
          )
          partial = score(
              synthetic('partially_correct', set(ids[:2]))
          )
          missing = score(
              synthetic('undetermined', all_ids, valid=False)
          )
          contradictory = score(
              synthetic('contradictory', all_ids)
          )

          assert full.score == 3.0
          assert not full.metadata['unscored_criteria']

          assert abs(partial.score - 2.0) < 0.0001
          assert not partial.metadata['unscored_criteria']

          assert contradictory.score == 0.0
          assert missing.score == 0.0
          assert missing.metadata[
              'unscored_criteria'
          ] == [criterion.id]

          print(
              'OK: evidencia simulada total=3, '
              'parcial=2, contradiccion=0, '
              'indeterminada=pendiente'
          )

          # Los observables no autorizados deben bloquearse.
          draft = {
              'id': 'PRUEBA',
              'tipo': 'abierta',
              'enunciado': 'Explicar dos ideas',
              'maximo': 2,
              'aprobada': True,
              'criterios': [{
                  'id': 'C',
                  'descripcion': 'Dos ideas',
                  'puntos': 2,
                  'observables': [
                      {'descripcion': 'idea A'},
                      {'descripcion': 'idea B'}
                  ]
              }]
          }

          try:
              compile_question(
                  draft,
                  assessment_id='CI-3.2'
              )
          except RubricValidationError:
              pass
          else:
              raise AssertionError(
                  'No se deben activar observables no aprobados'
              )

          print('OK: rubricas no aprobadas rechazadas')
          print(
              'Pruebas contractuales Evalia 3.2 completadas; '
              'SIN validar precision semantica'
          )
          PY
